<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperação — Time Comercial</title>

<!-- Deixa instalar como aplicativo (Mac, Windows, Android, iPhone) —
     pedido do usuário em 2026-09-29: assim o sistema trata como um app
     próprio (ícone, nome, permissão de notificação separada), não "uma
     aba qualquer do Chrome". -->
<link rel="manifest" href="manifest-recuperacao.json">
<link rel="icon" href="icones/icon-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="theme-color" content="#060608">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recuperação">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  /* ==============================
     RECUPERAÇÃO — segundo painel de TV, separado do Fluxo Vivo. Mesmo
     sistema visual (tokens, senha, tom escuro) pra parecer a mesma
     família de painel, mas conteúdo próprio: quem abandonou carrinho,
     ficou com PIX pendente ou cartão recusado hoje, e quem pagou — com
     a jornada de cada cliente até a etapa atual.
     ============================== */
  :root {
    --bg: #060608;
    --fg: #f5f5f7;
    --fg-dim: #83838f;
    --fg-faint: #4d4d57;
    --accent: #3ec6ff;
    --green: #34d399;
    --red: #fb5b5b;
    --yellow: #fbbf24;
    --purple: #b785f7;
    --line: rgba(255,255,255,0.09);
    --surface: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012));
    --panel-border: rgba(255,255,255,0.085);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:'Inter', -apple-system, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select { font-family:inherit; }

  .vignette {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 50% -8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      radial-gradient(ellipse 140% 100% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  .scene { position:fixed; inset:0; z-index:2; }
  .scene a, .scene button, .scene input, .scene select { pointer-events:auto; }

  .topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:clamp(20px, 3vh, 32px) clamp(28px, 4vw, 48px);
  }
  .brand {
    display:inline-flex; align-items:center; gap:9px;
    font-family:'IBM Plex Mono',monospace; font-size:clamp(0.68rem, 1vw, 0.8rem);
    font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:var(--fg-dim);
  }
  .brand::before {
    content:''; width:8px; height:8px; border-radius:2.5px; background:var(--yellow);
    box-shadow:0 0 12px var(--yellow); flex-shrink:0;
  }
  .topbar-clock {
    font-family:'IBM Plex Mono',monospace; font-size:clamp(0.68rem, 1vw, 0.8rem);
    color:var(--fg-faint); font-weight:600; letter-spacing:0.5px;
  }
  .topbar-actions { display:flex; align-items:center; gap:clamp(10px, 1.4vw, 18px); }
  .live-pill {
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono',monospace; font-size:0.68rem; font-weight:700;
    letter-spacing:1.4px; color:var(--fg-dim); cursor:default;
    background:rgba(255,255,255,0.04); border:1px solid var(--line);
    padding:7px 13px 7px 11px; border-radius:99px;
  }
  .live-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
  .live-pill.error .dot { background:var(--red); }
  .live-pill.connecting .dot { background:var(--yellow); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0.25; } }
  .icon-btn {
    width:34px; height:34px; border-radius:50%; background:none; border:1px solid var(--line);
    color:var(--fg-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn svg { width:16px; height:16px; }
  .icon-btn:hover { border-color:var(--accent); color:var(--accent); }
  .icon-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .icon-btn.muted { color:var(--red); border-color:rgba(251,91,91,0.4); }

  .stage {
    position:absolute; left:0; right:0; top:clamp(78px, 11vh, 110px); bottom:clamp(20px, 3vh, 32px);
    display:flex; flex-direction:column; gap:clamp(14px, 2.2vh, 24px);
  }

  /* ---------- resumo: quem vendeu hoje e quanto (pedido do usuário em
     2026-09-29 — não mais total do mês) ---------- */
  .resumo-zone {
    flex:0 0 auto; padding:clamp(14px, 2vh, 20px) clamp(28px, 5vw, 56px);
    background:var(--surface); border:1px solid var(--panel-border); border-radius:20px;
    box-shadow:0 24px 60px -34px rgba(0,0,0,0.6);
    display:flex; flex-direction:column; gap:10px;
  }
  .resumo-label {
    font-family:'IBM Plex Mono',monospace; font-size:clamp(0.6rem, 0.85vw, 0.72rem);
    font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--fg-dim);
  }
  .resumo-vendedores { display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px 26px; }
  .resumo-vendedor { display:flex; flex-direction:column; gap:1px; }
  .resumo-vendedor-linha { display:flex; align-items:baseline; gap:8px; }
  .resumo-vendedor-nome { font-weight:700; font-size:clamp(0.85rem, 1.2vw, 1.02rem); }
  .resumo-vendedor-valor {
    font-family:'IBM Plex Mono',monospace; font-weight:800; color:var(--fg);
    font-size:clamp(0.85rem, 1.2vw, 1.02rem); font-variant-numeric:tabular-nums;
  }
  /* produtos vendidos por cada um, discreto — pedido do usuário em
     2026-09-30 (era pra ter sido aqui desde o início, não no Fluxo Vivo). */
  .resumo-vendedor-produtos {
    font-family:'IBM Plex Mono',monospace; font-size:clamp(0.62rem, 0.85vw, 0.72rem);
    color:var(--fg-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .resumo-vazio { font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--fg-faint); }

  /* ---------- burst de comemoração — igual ao Fluxo Vivo (pedido do
     usuário em 2026-09-29: "igual aparece na outra tela do dashboard") ---------- */
  .burst-flash {
    position:fixed; inset:0; z-index:498; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 42%, var(--meme-color, var(--accent)) 0%, transparent 62%);
  }
  .burst-flash.show { animation:burstFlash 1s ease-out; }
  @keyframes burstFlash { 0%{opacity:0} 15%{opacity:0.3} 100%{opacity:0} }
  .burst {
    position:fixed; top:50%; left:50%; z-index:499; pointer-events:none;
    transform:translate(-50%,-50%) scale(0.85); opacity:0; text-align:center;
    transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease;
  }
  .burst.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .burst-emoji {
    width:clamp(4rem, 9vw, 6.5rem); height:clamp(4rem, 9vw, 6.5rem);
    margin:0 auto; color:var(--meme-color, var(--accent));
    filter:drop-shadow(0 0 40px var(--meme-color, var(--accent)));
  }
  .burst-emoji svg { width:100%; height:100%; display:block; }
  .burst.show .burst-emoji { animation:burstBounce 3s ease-in-out 1.6s; }
  @keyframes burstBounce {
    0%,100% { transform:scale(1) rotate(0deg); }
    20% { transform:scale(1.14) rotate(-6deg); } 40% { transform:scale(1) rotate(6deg); }
    60% { transform:scale(1.1) rotate(-4deg); } 80% { transform:scale(1) rotate(4deg); }
  }
  .burst-vendor { font-weight:800; font-size:clamp(1.3rem, 2.6vw, 1.9rem); margin-top:14px; }
  .burst-value {
    font-weight:900; letter-spacing:-1px; margin-top:2px; color:var(--meme-color, var(--accent));
    font-size:clamp(2.2rem, 5vw, 3.4rem); text-shadow:0 0 50px var(--meme-color, var(--accent));
    font-variant-numeric:tabular-nums;
  }
  .burst-title {
    font-family:'IBM Plex Mono',monospace; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    font-size:clamp(0.85rem, 1.4vw, 1.05rem); color:var(--meme-color, var(--accent)); margin-top:10px;
  }
  @media (prefers-reduced-motion: reduce) {
    .burst, .burst-emoji, .burst-flash { animation:none !important; transition:none !important; }
  }

  /* ---------- botão de notificação do sistema ---------- */
  .icon-btn.ativo { color:var(--green); border-color:rgba(52,211,153,0.4); }

  /* ---------- botão de dia anterior + tema cinza quando ativo (pedido
     do usuário em 2026-09-29 — "pra não confundir" com dado ao vivo) ---------- */
  .dia-btn {
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono',monospace; font-size:0.7rem; font-weight:700;
    letter-spacing:0.4px; color:var(--fg-dim); cursor:pointer;
    background:rgba(255,255,255,0.04); border:1px solid var(--line);
    padding:7px 14px 7px 12px; border-radius:99px;
    transition:border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .dia-btn svg { width:15px; height:15px; flex-shrink:0; }
  .dia-btn:hover { border-color:var(--accent); color:var(--accent); }
  .dia-btn.ativo {
    background:rgba(251,191,36,0.14); border-color:rgba(251,191,36,0.5); color:var(--yellow);
  }
  body.modo-ontem {
    --bg: #2b2b2f;
    --surface: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
    --panel-border: rgba(255,255,255,0.14);
  }
  body.modo-ontem .live-pill.historico {
    background:rgba(251,191,36,0.12); border-color:rgba(251,191,36,0.4); color:var(--yellow);
  }
  body.modo-ontem .live-pill.historico .dot { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }

  /* ---------- quadro de recuperação: 4 faixas ---------- */
  .board { flex:1; min-height:0; display:flex; flex-direction:column; gap:clamp(10px, 1.6vh, 16px); }
  .lane {
    flex:1; min-height:0; display:flex; flex-direction:column; gap:8px;
    padding:clamp(12px, 1.6vh, 18px) clamp(24px, 4vw, 44px);
    background:var(--surface); border-radius:18px; border:1px solid var(--panel-border);
    box-shadow:0 24px 60px -34px rgba(0,0,0,0.6);
    border-left:3px solid var(--lane-color, var(--accent));
  }
  .lane-head { flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .lane-title {
    display:flex; align-items:center; gap:9px;
    font-family:'IBM Plex Mono',monospace; font-size:clamp(0.72rem, 1vw, 0.86rem);
    font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--fg);
  }
  .lane-title::before {
    content:''; width:8px; height:8px; border-radius:2px; background:var(--lane-color, var(--accent));
    box-shadow:0 0 10px var(--lane-color, var(--accent)); flex-shrink:0;
  }
  .lane-count {
    font-weight:800; font-size:clamp(1.1rem, 1.7vw, 1.4rem); color:var(--lane-color, var(--accent));
    font-variant-numeric:tabular-nums;
  }
  /* Rolagem lateral pra ver todo mundo da faixa (pedido do usuário em
     2026-09-29) — esse painel é pra usar com mouse/notebook, diferente do
     Fluxo Vivo que fica só olhando numa TV sem interação. */
  .lane-cards {
    flex:1; min-height:0; display:flex; align-items:stretch; gap:10px;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .lane-cards::-webkit-scrollbar { height:7px; }
  .lane-cards::-webkit-scrollbar-track { background:transparent; }
  .lane-cards::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; }
  .lane-cards::-webkit-scrollbar-thumb:hover { background:var(--fg-faint); }
  .lane-empty {
    flex:1; display:flex; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--fg-faint);
  }

  .lead-card {
    flex:0 0 auto; width:clamp(128px, 11.5vw, 168px);
    background:rgba(255,255,255,0.035); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; display:flex; flex-direction:column; justify-content:space-between; gap:6px;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  .lead-card.novo { animation:cardPop 0.5s cubic-bezier(0.34,1.56,0.64,1); border-color:var(--lane-color, var(--accent)); }
  @keyframes cardPop { 0%{ transform:scale(0.85); opacity:0.3; } 100%{ transform:scale(1); opacity:1; } }
  .lead-card-nome {
    font-weight:700; font-size:clamp(0.82rem, 1.1vw, 0.94rem); color:var(--fg);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lead-card-produto {
    font-size:clamp(0.66rem, 0.85vw, 0.74rem); color:var(--fg-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lead-card-tempo {
    font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--fg-faint);
    font-variant-numeric:tabular-nums;
  }
  .lead-card-trilha { display:flex; gap:4px; margin-top:2px; }
  .trilha-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .lead-card { cursor:default; }

  /* ---------- detalhe ao passar o mouse: um único elemento flutuante
     (position:fixed), reaproveitado por todos os cards — não pode ser um
     popover DENTRO do card, porque a faixa tem rolagem lateral própria e
     cortaria qualquer coisa que tentasse "escapar" verticalmente dela. ---------- */
  .lead-tooltip {
    position:fixed; z-index:900; width:280px; max-width:88vw;
    /* Jornada longa (muitas etapas) pode deixar o card mais alto que a
     * tela cabe — rolagem interna em vez de vazar pra fora (relatado
     * pelo usuário em 2026-09-29: card sumindo por baixo da tela). */
    max-height:80vh; overflow-y:auto;
    background:#101014; border:1px solid var(--panel-border); border-radius:14px;
    padding:16px 18px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);
    opacity:0; transform:translateY(6px) scale(0.98); pointer-events:none;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .lead-tooltip.show { opacity:1; transform:translateY(0) scale(1); }
  .lead-tooltip-nome { font-weight:800; font-size:1.05rem; color:var(--fg); }
  .lead-tooltip-hr { height:1px; background:var(--line); margin:12px 0; }
  .lead-tooltip-jornada-item { padding:8px 0; border-top:1px solid var(--line); }
  .lead-tooltip-jornada-item:first-child { border-top:none; padding-top:0; }
  .lead-tooltip-jornada-etapa { display:flex; align-items:center; gap:7px; font-weight:700; font-size:0.82rem; }
  .lead-tooltip-jornada-etapa .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .lead-tooltip-jornada-info {
    margin-top:4px; display:flex; flex-direction:column; gap:2px;
    font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--fg-dim);
  }
  .lead-tooltip-jornada-produto { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lead-tooltip-jornada-valor { color:var(--fg); font-weight:700; }
  .lead-tooltip-jornada-data { color:var(--fg-dim); }

  /* ---------- alerta de mudança nova ---------- */
  .alert-banner {
    position:fixed; top:76px; left:50%; transform:translate(-50%,-14px); z-index:480;
    display:flex; align-items:baseline; gap:10px;
    font-family:'IBM Plex Mono',monospace; font-weight:700;
    color:#04141c; background:var(--fg); padding:11px 22px; border-radius:99px;
    opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events:none;
    box-shadow:0 12px 30px -8px rgba(0,0,0,0.5);
  }
  .alert-banner.show { opacity:1; transform:translate(-50%,0); }
  .alert-banner .dot { width:8px; height:8px; border-radius:50%; background:var(--banner-color, var(--accent)); flex-shrink:0; align-self:center; }
  .alert-banner-name { font-weight:800; }
  .alert-banner-etapa { font-size:0.82em; opacity:0.75; }

  .toast {
    position:fixed; top:24px; left:50%; transform:translate(-50%,-14px); z-index:400;
    font-family:'IBM Plex Mono',monospace; font-size:0.8rem; font-weight:600;
    color:var(--bg); background:var(--fg); padding:10px 20px; border-radius:99px;
    opacity:0; transition:all 0.25s ease; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .loader {
    display:none; position:fixed; inset:0; z-index:900; background:var(--bg);
    flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  .loader.on { display:flex; }
  .loader-ring {
    width:40px; height:40px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader-msg { font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--fg-dim); }

  .offline-banner {
    display:none; position:fixed; top:0; left:0; right:0; z-index:600;
    background:var(--red); color:#1a0000; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:0.78rem;
    padding:9px; letter-spacing:0.3px;
  }
  .offline-banner.show { display:block; }

  @media (prefers-reduced-motion: reduce) {
    .lead-card, .alert-banner, .loader-ring { animation:none !important; transition:none !important; }
  }

  @media (max-width: 780px) {
    .stage { top:clamp(96px, 15vh, 130px); }
    .topbar { flex-wrap:wrap; row-gap:8px; }
    .resumo-zone { flex-direction:column; align-items:flex-start; gap:10px; }
    .board { overflow-y:auto; }
    .lane { flex:0 0 auto; min-height:150px; }
    .lane-cards { overflow-x:auto; }
  }

  .lock-screen {
    position:fixed; inset:0; z-index:3000; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .lock-screen.hidden { display:none; }
  .lock-box { display:flex; flex-direction:column; align-items:center; gap:14px; width:min(90vw, 340px); }
  .lock-title { font-weight:800; font-size:1.3rem; letter-spacing:0.02em; }
  .lock-sub { color:var(--fg-faint); font-size:0.85rem; margin-bottom:8px; text-align:center; }
  .lock-input {
    width:100%; box-sizing:border-box; background:#101014; color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:1rem;
    text-align:center; letter-spacing:0.08em;
  }
  .lock-input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .lock-btn {
    width:100%; background:var(--accent); color:#04121a; border:none; border-radius:10px;
    padding:13px 16px; font-weight:700; font-size:0.95rem; cursor:pointer;
  }
  .lock-btn:active { transform:scale(0.98); }
  .lock-error { color:#ff6b6b; font-size:0.8rem; min-height:1em; }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <span class="lock-title">Time Comercial</span>
    <span class="lock-sub">Digite a senha para ver o painel</span>
    <input id="lockInput" class="lock-input" type="password" inputmode="text" autocomplete="off" placeholder="Senha" onkeydown="if(event.key==='Enter') tentarDesbloquear()" />
    <button id="lockBtn" class="lock-btn" onclick="tentarDesbloquear()">Entrar</button>
    <span id="lockError" class="lock-error"></span>
  </div>
</div>

<div class="vignette"></div>

<div class="scene">
  <div class="topbar">
    <span class="brand">Recuperação</span>
    <span class="topbar-clock" id="clock">--:--</span>
    <div class="topbar-actions">
      <button class="live-pill" id="livePill"><span class="dot"></span><span id="liveLabel">conectando</span></button>
      <button class="dia-btn" id="diaBtn" title="Alternar entre hoje e o dia anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="diaBtnTexto">Ver dia de ontem</span>
      </button>
      <button class="icon-btn" id="notifBtn" title="Avisos do sistema (aparecem por cima de outros programas)" aria-label="Ativar avisos do sistema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

function countTier(n) { if (n >= 10) return 'dez'; if (n >= 5) return 'cinco'; if (n >= 3) return 'tres'; return 'primeira'; }
function pickMeme(pool) { const p = pool.length ? pool : [0]; return MEME_LIBRARY[p[Math.floor(Math.random()*p.length)]]; }

function tone(ctx, {type, freq, freqEnd, start, dur, peak}) {
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, start + dur * 0.85);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.02, dur * 0.2));
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.start(start); osc.stop(start + dur);
}
const SOUND_PACKS = {
  classico: ctx => { const now = ctx.currentTime; tone(ctx,{type:'square',freq:987.77,start:now,dur:0.09,peak:0.12}); tone(ctx,{type:'square',freq:1318.51,start:now+0.09,dur:0.18,peak:0.12}); }
};
const saleSoundCache = {};
function getSaleSound() {
  if (!saleSoundCache.classico) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      saleSoundCache.classico = () => SOUND_PACKS.classico(ctx);
    } catch { saleSoundCache.classico = null; }
  }
  return saleSoundCache.classico;
}
const CELEBRATION_SOUNDS = {
  sirene: ctx => { const now = ctx.currentTime; for (let i=0;i<6;i++) tone(ctx,{type:'sawtooth',freq:i%2===0?880:660,start:now+i*0.12,dur:0.13,peak:0.1}); },
  buzina: ctx => { const now = ctx.currentTime; tone(ctx,{type:'sawtooth',freq:220,start:now,dur:0.5,peak:0.13}); tone(ctx,{type:'sawtooth',freq:330,start:now,dur:0.5,peak:0.08}); },
  caixa: ctx => { const now = ctx.currentTime; tone(ctx,{type:'sine',freq:1568,start:now,dur:0.07,peak:0.12}); tone(ctx,{type:'sine',freq:2093,start:now+0.08,dur:0.12,peak:0.12}); },
  tambor: ctx => { tone(ctx,{type:'triangle',freq:160,freqEnd:50,start:ctx.currentTime,dur:0.3,peak:0.16}); },
  laser: ctx => { tone(ctx,{type:'square',freq:1800,freqEnd:300,start:ctx.currentTime,dur:0.18,peak:0.09}); },
  aplauso: ctx => { const now = ctx.currentTime; [523,659,784,1047].forEach((freq,i) => tone(ctx,{type:'sine',freq,start:now+i*0.06,dur:0.15,peak:0.09})); }
};
const celebSoundCache = {};
function getCelebrationSound(kind) {
  if (!celebSoundCache[kind]) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const play = CELEBRATION_SOUNDS[kind] || CELEBRATION_SOUNDS.caixa;
      celebSoundCache[kind] = () => play(ctx);
    } catch { celebSoundCache[kind] = null; }
  }
  return celebSoundCache[kind];
}

// ================================================================
// RELÓGIO — mesmo truque do Fluxo Vivo: o relógio do APARELHO pode
// estar errado (TV/Android box sem hora certa); corrige usando o
// cabeçalho HTTP "Date" que toda resposta do servidor já traz.
// ================================================================
let relogioDriftMs = 0;
function agoraCorrigido() { return new Date(Date.now() + relogioDriftMs); }
function corrigirRelogio(headerDate) {
  if (!headerDate) return;
  const servidor = new Date(headerDate).getTime();
  if (isNaN(servidor)) return;
  relogioDriftMs = servidor - Date.now();
}
// São Paulo não tem horário de verão desde 2019 — fuso fixo -3h. Mesmo
// truque do Fluxo Vivo: converte tudo pra UTC deslocado e sempre lê de
// volta com getters de UTC, pra não depender do fuso do aparelho.
const SP_OFFSET_MS = 3 * 60 * 60 * 1000;
function camposSP(d) { return new Date(d.getTime() - SP_OFFSET_MS); }
function hojeSPTextoData() {
  const sp = camposSP(agoraCorrigido());
  const dia = String(sp.getUTCDate()).padStart(2, '0');
  const mes = String(sp.getUTCMonth() + 1).padStart(2, '0');
  return `${dia}/${mes}/${sp.getUTCFullYear()}`;
}
function fmtMin(ms) {
  const totalMin = Math.max(0, Math.round(ms / 60000));
  if (totalMin < 60) return totalMin <= 1 ? '1 min' : totalMin + ' min';
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return m === 0 ? h + 'h' : h + 'h ' + m + 'min';
}
// Data/hora exata (horário de São Paulo, explícito) de uma etapa da
// jornada — pedido do usuário em 2026-09-29: com "há Xh" só, é difícil
// saber se duas etapas bem próximas aconteceram no mesmo instante ou só
// coincidem no arredondamento, e não dá pra ver se foi ontem ou hoje.
function fmtDataHora(iso) {
  const d = new Date(iso);
  const opts = {timeZone:'America/Sao_Paulo'};
  return d.toLocaleDateString('pt-BR', {...opts, day:'2-digit', month:'2-digit'}) + ' às ' + d.toLocaleTimeString('pt-BR', {...opts, hour:'2-digit', minute:'2-digit'});
}

// ================================================================
// SOM — mesmo sintetizador do Fluxo Vivo (Web Audio API, sem arquivo
// externo). Um som só, tocado em toda mudança nova, independente da
// faixa — pedido do usuário: "notificação com som a cada nova mudança".
// ================================================================
function tone(ctx, {type, freq, freqEnd, start, dur, peak}) {
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, start + dur * 0.85);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.02, dur * 0.2));
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.start(start); osc.stop(start + dur);
}
let alertSoundCache = null;
function playAlertSound() {
  if (!State.somOn) return;
  if (alertSoundCache === null) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      alertSoundCache = () => {
        const now = ctx.currentTime;
        tone(ctx, {type:'sine', freq:660, freqEnd:990, start:now, dur:0.14, peak:0.11});
        tone(ctx, {type:'sine', freq:990, start:now+0.13, dur:0.16, peak:0.1});
      };
    } catch { alertSoundCache = false; }
  }
  if (alertSoundCache) alertSoundCache();
}
function toggleSom() {
  State.somOn = !State.somOn;
  try { localStorage.setItem('recuperacaoSomOn', State.somOn ? '1' : '0'); } catch (e) {}
  DOM.soundIconOn.hidden = !State.somOn;
  DOM.soundIconOff.hidden = State.somOn;
  DOM.soundBtn.classList.toggle('muted', !State.somOn);
}

// ================================================================
// DADOS — busca o quadro de recuperação (servidor próprio) e o resumo
// (mesma planilha do Fluxo Vivo, só leitura das duas linhas de total).
// ================================================================
async function buscarQuadro() {
  const r = await fetch(API_BASE + '/recuperacao/hoje?dias_atras=' + State.diasAtras);
  if (!r.ok) throw new Error('recuperacao: ' + r.status);
  corrigirRelogio(r.headers.get('date'));
  const j = await r.json();
  return j.leads || [];
}
// Linhas 4-18 da aba DASHBOARD (mesmo intervalo que o Fluxo Vivo usa pro
// ranking) — só nome (coluna H) e vendas hoje (coluna I).
async function buscarVendedoresHoje() {
  const base = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values`;
  const r = await fetch(`${base}/${encodeURIComponent('DASHBOARD!A4:L18')}?key=${SHEET_KEY}`);
  if (!r.ok) return [];
  const j = await r.json();
  const rows = j.values || [];
  return rows.map(row => {
    const nome = normName(row[7]);
    if (!nome) return null;
    return { nome, vendasHoje: pVal(row[8]) };
  }).filter(Boolean);
}
// Quais produtos cada vendedor vendeu hoje, pra mostrar ao lado do nome
// dele no resumo — pedido do usuário em 2026-09-30 (o pedido original
// tinha ido pro Fluxo Vivo por engano; é aqui que devia ter sido).
// Busca a aba DADOS BRUTOS (mesma fonte do Fluxo Vivo) e filtra pela
// data de hoje em São Paulo — essa aba não tem endpoint no backend,
// só existe na planilha mesmo.
async function buscarProdutosPorVendedorHoje() {
  const base = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values`;
  const r = await fetch(`${base}/${encodeURIComponent('DADOS BRUTOS!A:H')}?key=${SHEET_KEY}`);
  if (!r.ok) return new Map();
  const j = await r.json();
  const rows = j.values || [];
  const hoje = hojeSPTextoData(); // "DD/MM/AAAA"
  const map = new Map(); // vendedor -> Map(produto -> qtd)
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[0] || !row[0].startsWith(hoje)) continue;
    const vendedor = normName(row[1]);
    const produto = (row[2] || 'Sem produto').trim();
    if (!vendedor) continue;
    if (!map.has(vendedor)) map.set(vendedor, new Map());
    const porProduto = map.get(vendedor);
    porProduto.set(produto, (porProduto.get(produto) || 0) + 1);
  }
  return map;
}
// Lista os produtos de um vendedor com a quantidade de cada um
// ("O GESTOR ×5 · Rating CNPJ ×2") — mostra só os 2 mais vendidos e
// resume o resto num "+N outros", pra não estourar a linha do resumo.
function listaProdutosVendedor(porProduto, max) {
  if (!porProduto || !porProduto.size) return '';
  max = max || 2;
  const linhas = [...porProduto.entries()].sort((a, b) => b[1] - a[1]);
  const principais = linhas.slice(0, max);
  const resto = linhas.slice(max);
  const partes = principais.map(([nome, qtd]) => `${nome} ×${qtd}`);
  if (resto.length) {
    const somaResto = resto.reduce((s, [, q]) => s + q, 0);
    partes.push(`+${resto.length} outro${resto.length > 1 ? 's' : ''} (${somaResto})`);
  }
  return partes.join('  ·  ');
}

// Mostra nome + valor de quem vendeu hoje (pedido do usuário em
// 2026-09-29 — troca o total do mês), e agora também os produtos que
// cada um vendeu, numa linha pequena embaixo do nome (pedido do
// usuário em 2026-09-30). Quem vender de novo dispara a comemoração
// completa, igual ao Fluxo Vivo.
function renderResumoVendedores(vendedores, produtosPorVendedor) {
  const comVenda = vendedores.filter(v => v.vendasHoje > 0).sort((a,b) => b.vendasHoje - a.vendasHoje);
  DOM.resumoVendedores.innerHTML = comVenda.length
    ? comVenda.map(v => {
        const display = State.displayNames[v.nome] || v.nome;
        const cor = State.colors[v.nome] || 'var(--fg)';
        const produtosTxt = produtosPorVendedor ? listaProdutosVendedor(produtosPorVendedor.get(v.nome)) : '';
        return `<div class="resumo-vendedor">
          <div class="resumo-vendedor-linha">
            <span class="resumo-vendedor-nome" style="color:${cor}">${escapeHtml(display)}</span>
            <span class="resumo-vendedor-valor">${fmt(v.vendasHoje)}</span>
          </div>
          ${produtosTxt ? `<span class="resumo-vendedor-produtos">${escapeHtml(produtosTxt)}</span>` : ''}
        </div>`;
      }).join('')
    : '<span class="resumo-vazio">ninguém vendeu ainda hoje</span>';

  vendedores.forEach(v => {
    const prev = State.prevTotals[v.nome] || 0;
    if (State.vendedoresBaselinePronto && v.vendasHoje > prev) {
      showSaleNotification(v.nome, v.vendasHoje - prev);
    }
    State.prevTotals[v.nome] = v.vendasHoje;
  });
  State.vendedoresBaselinePronto = true;
}

// ================================================================
// NOTIFICAÇÃO DO SISTEMA — pedido do usuário em 2026-09-29: o aviso
// precisa aparecer por cima de QUALQUER programa aberto, não só dentro
// da aba do navegador. Isso só é possível com a Notification API do
// navegador (um aviso de verdade do sistema operacional, tipo os que
// WhatsApp Web ou Gmail mandam) — precisa que a pessoa clique "Permitir"
// uma vez (botão de sino no topo). Sem essa permissão, o aviso só
// aparece se a aba estiver visível na tela.
// ================================================================
function notificarSistema(titulo, corpo) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(titulo, { body: corpo, silent: false });
    setTimeout(() => n.close(), 8000);
  } catch (e) {}
}
function atualizarBotaoNotif() {
  if (!('Notification' in window)) { DOM.notifBtn.hidden = true; return; }
  const permitido = Notification.permission === 'granted';
  DOM.notifBtn.classList.toggle('ativo', permitido);
  DOM.notifBtn.title = permitido
    ? 'Avisos do sistema ativados (aparecem por cima de outros programas)'
    : 'Ativar avisos do sistema (aparecem por cima de outros programas)';
}
async function pedirPermissaoNotificacao() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'denied') {
    showToast('Notificações bloqueadas — libere nas configurações do navegador/sistema');
    return;
  }
  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }
  atualizarBotaoNotif();
  if (Notification.permission === 'granted') showToast('Avisos do sistema ativados');
}

function renderQuadro(leads) {
  const porEtapa = { carrinho_abandonado:[], pix_pendente:[], cartao_recusado:[], pago:[] };
  leads.forEach(l => { if (porEtapa[l.etapa_atual]) porEtapa[l.etapa_atual].push(l); });

  const agora = agoraCorrigido();
  const novosIds = [];

  ETAPAS.forEach(etapa => {
    const lista = porEtapa[etapa].sort((a,b) => new Date(b.quando) - new Date(a.quando));
    document.getElementById('count-' + etapa).textContent = lista.length;
    const container = document.getElementById('cards-' + etapa);

    if (!lista.length) {
      container.innerHTML = '<div class="lane-empty">ninguém aqui agora</div>';
      return;
    }

    // Todos os cards da faixa — sem limite (pedido do usuário em
    // 2026-09-29: rolar pro lado pra ver todo mundo, ver .lane-cards).
    container.innerHTML = lista.map(l => {
      const ehNovo = State.baselinePronto && !State.vistos.has(l.evento_id);
      if (ehNovo) novosIds.push({id:l.evento_id, nome:l.nome, etapa});
      State.leadPorEventoId.set(l.evento_id, l);
      const trilha = (l.etapas_anteriores || []).map(e =>
        `<span class="trilha-dot" style="background:${COR_ETAPA[e.etapa] || 'var(--fg-faint)'}" title="${escapeHtml(NOME_ETAPA[e.etapa] || e.etapa)}"></span>`
      ).join('');
      // Card de quem pagou, quando a venda tem vendedor identificado: a
      // borda ganha a MESMA cor do nome dele no ranking — dá pra ver de
      // longe quem fechou aquela venda sem precisar passar o mouse
      // (pedido do usuário em 2026-09-30).
      let corVendedorEstilo = '';
      if (etapa === 'pago' && l.vendedor) {
        const corVendedor = State.colors[normName(l.vendedor)];
        if (corVendedor) corVendedorEstilo = ` style="border-color:${corVendedor}; border-width:2px;"`;
      }
      return `
        <div class="lead-card${ehNovo ? ' novo' : ''}" data-evento-id="${l.evento_id}"${corVendedorEstilo}>
          <div>
            <div class="lead-card-nome">${escapeHtml(l.nome)}</div>
            <div class="lead-card-produto">${escapeHtml(l.produto || 'produto não identificado')}</div>
          </div>
          <div>
            ${trilha ? `<div class="lead-card-trilha">${trilha}</div>` : ''}
            <div class="lead-card-tempo">há ${fmtMin(agora - new Date(l.quando))}</div>
          </div>
        </div>`;
    }).join('');
  });

  leads.forEach(l => State.vistos.add(l.evento_id));
  if (!State.baselinePronto) {
    State.baselinePronto = true;
  } else {
    novosIds.forEach(n => enqueueAlert(n.nome, n.etapa));
  }
}

// ================================================================
// CARD DE DETALHE (hover) — pedido do usuário em 2026-09-29: passar o
// mouse mostra informação mais completa do lead e da venda. Um elemento
// só, reaproveitado (ver #leadTooltip no CSS/HTML), preenchido e
// posicionado a cada card que o mouse passa por cima.
// ================================================================
function montarTooltipHtml(l) {
  const agora = agoraCorrigido();
  const jornadaCompleta = [...(l.etapas_anteriores || []), {etapa:l.etapa_atual, produto:l.produto, valor:l.valor, quando:l.quando, atual:true}];
  const itensHtml = jornadaCompleta.slice().reverse().map(e => `
    <div class="lead-tooltip-jornada-item">
      <span class="lead-tooltip-jornada-etapa">
        <span class="dot" style="background:${COR_ETAPA[e.etapa] || 'var(--fg-faint)'}"></span>
        ${escapeHtml(NOME_ETAPA[e.etapa] || e.etapa)}${e.atual ? ' (atual)' : ''}
      </span>
      <div class="lead-tooltip-jornada-info">
        <span class="lead-tooltip-jornada-produto" title="${escapeHtml(e.produto || '')}">${escapeHtml(e.produto || 'produto não identificado')}</span>
        <span class="lead-tooltip-jornada-valor">${fmt(e.valor || 0)}</span>
        <span class="lead-tooltip-jornada-data">${fmtDataHora(e.quando)} · há ${fmtMin(agora - new Date(e.quando))}</span>
      </div>
    </div>`).join('');

  return `
    <div class="lead-tooltip-nome">${escapeHtml(l.nome)}</div>
    <div class="lead-tooltip-hr"></div>
    ${itensHtml}`;
}
function mostrarTooltip(card) {
  const l = State.leadPorEventoId.get(Number(card.dataset.eventoId));
  if (!l) return;
  DOM.leadTooltip.innerHTML = montarTooltipHtml(l);
  DOM.leadTooltip.classList.add('show');
  posicionarTooltip(card);
}
function posicionarTooltip(card) {
  const r = card.getBoundingClientRect();
  const tt = DOM.leadTooltip;
  const margem = 12;
  const largura = tt.offsetWidth || 280;
  let left = r.left + r.width / 2 - largura / 2;
  left = Math.max(margem, Math.min(left, window.innerWidth - largura - margem));

  // Card com jornada longa fica mais alto — escolhe o lado (cima/baixo)
  // que tem mais espaço, e SEMPRE prende dentro da tela no final (nunca
  // deixa vazar por baixo nem por cima, mesmo perto da borda da tela —
  // relatado pelo usuário em 2026-09-29).
  const altura = tt.offsetHeight || 200;
  const espacoAcima = r.top - margem;
  const espacoAbaixo = window.innerHeight - r.bottom - margem;
  let top;
  if (espacoAcima >= altura) top = r.top - altura - 14;
  else if (espacoAbaixo >= altura) top = r.bottom + 14;
  else top = espacoAcima > espacoAbaixo ? margem : window.innerHeight - altura - margem;
  top = Math.max(margem, Math.min(top, window.innerHeight - altura - margem));

  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}
function esconderTooltip() { DOM.leadTooltip.classList.remove('show'); }
function ligarHoverDosCards() {
  document.getElementById('board').addEventListener('mouseover', e => {
    const card = e.target.closest('.lead-card');
    if (card) mostrarTooltip(card);
  });
  document.getElementById('board').addEventListener('mouseout', e => {
    const card = e.target.closest('.lead-card');
    const indo = e.relatedTarget && e.relatedTarget.closest('.lead-card');
    if (card && !indo) esconderTooltip();
  });
  document.getElementById('board').addEventListener('scroll', esconderTooltip, true);
}
// Roda do mouse manda "rolar pra baixo" (deltaY), não "rolar pro lado" —
// isso não vira rolagem lateral sozinho, é preciso traduzir aqui (bug
// relatado pelo usuário em 2026-09-29: rolagem não acontecia). Só desktop
// (mobile já rola por toque, sem precisar disso, e tem rolagem vertical
// da página que não pode ser sequestrada).
function ligarRolagemLateral() {
  document.getElementById('board').addEventListener('wheel', e => {
    if (window.innerWidth <= 780) return;
    const faixa = e.target.closest('.lane-cards');
    if (!faixa || faixa.scrollWidth <= faixa.clientWidth) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    faixa.scrollLeft += e.deltaY;
    e.preventDefault();
  }, {passive:false});
}

async function atualizarTudo() {
  try {
    updateConnectionStatus('connecting');
    if (State.diasAtras === 0) {
      const [leads, vendedores, produtosPorVendedor] = await Promise.all([
        buscarQuadro(), buscarVendedoresHoje(), buscarProdutosPorVendedorHoje(),
      ]);
      renderQuadro(leads);
      renderResumoVendedores(vendedores, produtosPorVendedor);
    } else {
      // Não existe planilha de dias passados (o Fluxo Vivo só guarda o
      // dia de hoje) — o resumo por vendedor só faz sentido olhando hoje.
      const leads = await buscarQuadro();
      renderQuadro(leads);
      DOM.resumoVendedores.innerHTML = '<span class="resumo-vazio">resumo por vendedor só está disponível pro dia de hoje</span>';
    }
    updateConnectionStatus('live');
    DOM.offlineBanner.classList.remove('show');
    return true;
  } catch (e) {
    console.error('Erro ao atualizar:', e);
    updateConnectionStatus('error');
    return false;
  }
}

// Alterna entre hoje e ontem (pedido do usuário em 2026-09-29) — troca o
// tema pra cinza pra nunca confundir com dado ao vivo. Zera a linha de
// base de "quem já vi" antes de buscar, pra trocar de dia nunca disparar
// alerta/comemoração/notificação como se fosse novidade — nada num dia
// passado é "novo".
async function alternarDia() {
  State.diasAtras = State.diasAtras === 0 ? 1 : 0;
  const vendoOntem = State.diasAtras > 0;
  document.body.classList.toggle('modo-ontem', vendoOntem);
  DOM.diaBtn.classList.toggle('ativo', vendoOntem);
  DOM.diaBtnTexto.textContent = vendoOntem ? 'Voltar para hoje' : 'Ver dia de ontem';
  State.vistos = new Set();
  State.baselinePronto = false;
  showLoad(true, vendoOntem ? 'Buscando dia anterior...' : 'Voltando para hoje...');
  await atualizarTudo();
  showLoad(false);
}

// ================================================================
// UI helpers
// ================================================================
function showToast(msg) {
  DOM.toast.textContent = msg;
  DOM.toast.classList.add('show');
  setTimeout(() => DOM.toast.classList.remove('show'), 2500);
}
function showLoad(on, msg) {
  DOM.loader.classList.toggle('on', on);
  if (msg) DOM.loaderMsg.textContent = msg;
}
function updateConnectionStatus(status) {
  DOM.livePill.className = 'live-pill';
  if (status === 'live' && State.diasAtras > 0) { DOM.livePill.classList.add('historico'); DOM.liveLabel.textContent = 'dia anterior'; }
  else if (status === 'live') DOM.liveLabel.textContent = 'ao vivo';
  else if (status === 'error') { DOM.livePill.classList.add('error'); DOM.liveLabel.textContent = 'erro de conexão'; }
  else { DOM.livePill.classList.add('connecting'); DOM.liveLabel.textContent = 'conectando'; }
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
function tickClock() {
  const now = agoraCorrigido();
  const opts = {timeZone:'America/Sao_Paulo'};
  DOM.clock.textContent = now.toLocaleDateString('pt-BR', opts) + ' · ' + now.toLocaleTimeString('pt-BR', {...opts, hour:'2-digit', minute:'2-digit'});
}
setInterval(tickClock, 1000);

let refreshTimer = null;
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(atualizarTudo, REFRESH_MS);
}

// ================================================================
// TRAVA DE ACESSO — mesma senha/mecanismo do Fluxo Vivo.
// ================================================================
function tentarDesbloquear() {
  const input = document.getElementById('lockInput');
  const erro = document.getElementById('lockError');
  if (SENHAS_VALIDAS.has(input.value)) {
    try { localStorage.setItem('fluxoDesbloqueado', '1'); } catch (e) {}
    document.getElementById('lockScreen').classList.add('hidden');
  } else {
    erro.textContent = 'Senha incorreta';
    input.value = '';
    input.focus();
  }
}
(function verificarAcesso() {
  let ok = false;
  try { ok = localStorage.getItem('fluxoDesbloqueado') === '1'; } catch (e) {}
  if (ok) document.getElementById('lockScreen')?.classList.add('hidden');
})();

// ================================================================
// INIT
// ================================================================
window.addEventListener('load', async () => {
  cacheDOM();
  tickClock();
  ligarHoverDosCards();
  ligarRolagemLateral();
  // Registra o service worker (só existe pra permitir "instalar como
  // app" — não guarda nada em cache, ver service-worker-recuperacao.js).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker-recuperacao.js').catch(() => {});
  }
  try { State.somOn = localStorage.getItem('recuperacaoSomOn') !== '0'; } catch (e) {}
  DOM.soundIconOn.hidden = !State.somOn;
  DOM.soundIconOff.hidden = State.somOn;
  DOM.soundBtn.classList.toggle('muted', !State.somOn);
  DOM.soundBtn.addEventListener('click', toggleSom);
  atualizarBotaoNotif();
  DOM.notifBtn.addEventListener('click', pedirPermissaoNotificacao);
  DOM.diaBtn.addEventListener('click', alternarDia);
  DOM.fullscreenBtn.addEventListener('click', toggleFullscreen);

  if (!navigator.onLine) DOM.offlineBanner.classList.add('show');

  showLoad(true, 'Buscando dados...');
  const ok = await atualizarTudo();
  showLoad(false);
  if (!ok) showToast('Não foi possível conectar ao servidor agora');
  State.isConnected = true;
  startAutoRefresh();
});
window.addEventListener('online', () => { DOM.offlineBanner.classList.remove('show'); atualizarTudo(); });
window.addEventListener('offline', () => DOM.offlineBanner.classList.add('show'));
</script>
